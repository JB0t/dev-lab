---
# Self-signed ClusterIssuer for generating Linkerd trust anchor
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-trust-anchor-selfsigned
spec:
  selfSigned: {}

---
# Linkerd Trust Anchor Certificate (self-signed root CA)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: linkerd
spec:
  secretName: linkerd-trust-anchor
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: root.linkerd.cluster.local
  isCA: true
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
    - digital signature
    - key encipherment
  issuerRef:
    name: linkerd-trust-anchor-selfsigned
    kind: ClusterIssuer