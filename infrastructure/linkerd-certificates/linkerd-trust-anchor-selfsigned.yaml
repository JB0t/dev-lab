---
# Self-signed ClusterIssuer for generating the initial root CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}

---
# Root CA Certificate (self-signed) - this becomes the trust anchor
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor-ca
  namespace: linkerd
spec:
  secretName: linkerd-trust-anchor
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: root.linkerd.cluster.local
  isCA: true
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
    - digital signature
    - key encipherment
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer