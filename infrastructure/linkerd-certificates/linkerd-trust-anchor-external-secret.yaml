---
# ExternalSecret for Linkerd Trust Anchor certificates
# This manages the trust anchor certificates required by Linkerd from external secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkerd-trust-anchor-external
  namespace: linkerd
spec:
  refreshInterval: 24h  # Check for updates daily
  secretStoreRef:
    name: github-cluster-secret-store
    kind: ClusterSecretStore
  
  target:
    name: linkerd-trust-anchor
    creationPolicy: Owner
    type: kubernetes.io/tls
  
  data:
    - secretKey: tls.crt
      remoteRef:
        key: LINKERD_TRUST_ANCHOR_CERT
    - secretKey: tls.key
      remoteRef:
        key: LINKERD_TRUST_ANCHOR_KEY