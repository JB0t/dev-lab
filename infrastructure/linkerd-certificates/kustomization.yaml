apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dev-lab-linkerd-certificates
  namespace: linkerd

resources:
  - linkerd-certs.yaml

secretGenerator:
  - name: linkerd-trust-anchor
    namespace: linkerd
    type: kubernetes.io/tls
    files:
      - tls.crt=ca.crt
      - tls.key=ca.key

configurations:
  - kustomizeconfig.yaml