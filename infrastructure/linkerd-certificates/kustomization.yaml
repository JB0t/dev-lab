apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dev-lab-linkerd-certificates
  namespace: linkerd

resources:
  - linkerd-certs.yaml
  - linkerd-trust-anchor-external-secret.yaml

# Note: The linkerd-trust-anchor secret is now managed by external-secrets
# via ExternalSecret resource defined in this component

configurations:
  - kustomizeconfig.yaml