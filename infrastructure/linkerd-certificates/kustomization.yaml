apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dev-lab-linkerd-certificates
  namespace: linkerd

resources:
  - linkerd-certs.yaml
  - linkerd-trust-anchor-selfsigned.yaml

# Note: The linkerd-trust-anchor secret is now auto-generated by cert-manager
# using a self-signed ClusterIssuer - no external secrets needed

configurations:
  - kustomizeconfig.yaml