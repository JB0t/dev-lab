apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dev-lab-cert-manager
  namespace: linkerd

resources:
  - namespaces.yaml
  - repositories.yaml
  - linkerd-cert-manager.yaml

# Note: Certificates moved to separate linkerd-certificates component
# to avoid CRD chicken-and-egg problem

configurations:
  - kustomizeconfig.yaml