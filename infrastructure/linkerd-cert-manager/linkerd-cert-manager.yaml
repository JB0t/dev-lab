---
# Linkerd-specific cert-manager Helm Repository
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: jetstack-linkerd
  namespace: linkerd
spec:
  interval: 1h
  url: https://charts.jetstack.io

---
# Linkerd cert-manager deployment
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: linkerd-cert-manager
  namespace: linkerd
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: ">=1.15.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack-linkerd
        namespace: linkerd
      interval: 12h
  values:
    # Install CRDs as part of this deployment
    crds:
      enabled: true
      keep: false
    
    # Deploy to linkerd namespace
    namespace: linkerd
    
    # Scope cert-manager to only manage linkerd namespace certificates
    extraArgs:
      - --namespace=linkerd
      - --enable-certificate-owner-ref=false
      - --cluster-resource-namespace=linkerd
    
    # Controller configuration
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # Webhook configuration
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Use non-default port to avoid conflicts
      securePort: 10251
      
    # CA Injector configuration  
    cainjector:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi