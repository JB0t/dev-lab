# Container Registry for dev-lab
# Uses the existing registry configuration from dev-lab/registry/

---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-lab-registry
  labels:
    name: dev-lab-registry
    app.kubernetes.io/managed-by: flux

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: docker-registry
  namespace: dev-lab-registry
  labels:
    app: docker-registry
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: registry
          image: registry:2.8
          ports:
            - containerPort: 5000
              name: registry
              protocol: TCP
          env:
            - name: REGISTRY_CONFIG_PATH
              value: /etc/docker/registry/config.yml
          volumeMounts:
            - name: registry-config
              mountPath: /etc/docker/registry
              readOnly: true
            - name: registry-storage
              mountPath: /var/lib/registry
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: registry-config
          configMap:
            name: registry-config
        - name: registry-storage
          hostPath:
            path: /var/lib/registry
            type: DirectoryOrCreate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: dev-lab-registry
  labels:
    app.kubernetes.io/managed-by: flux
data:
  config.yml: |
    version: 0.1
    log:
      accesslog:
        disabled: true
      level: warn
      formatter: text
      fields:
        service: registry
        environment: development
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
        Access-Control-Allow-Origin: ['*']
        Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS', 'DELETE']
        Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Cache-Control']
        Access-Control-Max-Age: [1728000]
        Access-Control-Allow-Credentials: [true]
        Access-Control-Expose-Headers: ['Docker-Content-Digest']
    health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry
  namespace: dev-lab-registry
  labels:
    app: docker-registry
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    app: docker-registry
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: registry
  type: ClusterIP

---
# Registry UI for easier management
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry-ui
  namespace: dev-lab-registry
  labels:
    app: docker-registry-ui
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry-ui
  template:
    metadata:
      labels:
        app: docker-registry-ui
    spec:
      containers:
        - name: registry-ui
          image: joxit/docker-registry-ui:2.5.7
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SINGLE_REGISTRY
              value: "true"
            - name: REGISTRY_TITLE
              value: "Dev Lab Registry"
            - name: DELETE_IMAGES
              value: "true"
            - name: SHOW_CONTENT_DIGEST
              value: "true"
            - name: NGINX_PROXY_PASS_URL
              value: "http://docker-registry:5000"
            - name: SHOW_CATALOG_NB_TAGS
              value: "true"
            - name: CATALOG_MIN_BRANCHES
              value: "1"
            - name: CATALOG_MAX_BRANCHES
              value: "1"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry-ui
  namespace: dev-lab-registry
  labels:
    app: docker-registry-ui
    app.kubernetes.io/managed-by: flux
spec:
  selector:
    app: docker-registry-ui
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  type: NodePort
  # Make it accessible on port 5001
---
# Ingress for registry UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ui-ingress
  namespace: dev-lab-registry
  labels:
    app.kubernetes.io/managed-by: flux
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: registry.dev-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docker-registry-ui
                port:
                  number: 80
