apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dev-lab-service-mesh
  namespace: linkerd

resources:
  - repositories.yaml
  - linkerd-crds.yaml
  - linkerd-control-plane.yaml
  - linkerd-viz.yaml

# Note: linkerd-trust-anchor secret is now managed by ExternalSecret
# in the linkerd-certificates component

patches:
  # Patch Linkerd control plane to wait for cert-manager (external)
  - target:
      kind: HelmRelease
      name: linkerd-control-plane
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value:
          name: linkerd-cert-manager
          namespace: linkerd

configurations:
  - kustomizeconfig.yaml