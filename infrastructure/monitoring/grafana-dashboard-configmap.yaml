---
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-canary-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  linkerd-canary-dashboard.json: |
    {
      "id": null,
      "title": "Linkerd Canary Deployment Dashboard",
      "tags": [
        "linkerd",
        "flagger", 
        "canary",
        "prometheus"
      ],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Canary Deployment Status",
          "type": "stat",
          "targets": [
            {
              "expr": "flagger_canary_weight{workload=\"mesh-test-app\", exported_namespace=\"mesh-test\"}",
              "legendFormat": "Traffic Weight %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "green", "value": 0},
                  {"color": "yellow", "value": 50},
                  {"color": "red", "value": 80}
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Success Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\",classification!=\"failure\"}[1m]))/sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m]))*100",
              "legendFormat": "Success Rate %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 95},
                  {"color": "green", "value": 99}
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0}
        },
        {
          "id": 3,
          "title": "Request Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m]))",
              "legendFormat": "Requests/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Canary Phase",
          "type": "stat",
          "targets": [
            {
              "expr": "flagger_canary_status{name=\"mesh-test-app\", exported_namespace=\"mesh-test\"}",
              "legendFormat": "Phase",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "blue", "value": 0},
                  {"color": "green", "value": 1}, 
                  {"color": "red", "value": 2}
                ]
              },
              "mappings": [
                {"options": {"0": {"text": "Progressing", "color": "blue"}}, "type": "value"},
                {"options": {"1": {"text": "Succeeded", "color": "green"}}, "type": "value"},
                {"options": {"2": {"text": "Failed", "color": "red"}}, "type": "value"}
              ]
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0}
        },
        {
          "id": 5,
          "title": "Traffic Split Over Time",
          "type": "timeseries",
          "targets": [
            {
              "expr": "flagger_canary_weight{workload=\"mesh-test-app\", exported_namespace=\"mesh-test\"}",
              "legendFormat": "Canary Weight %",
              "refId": "A"
            },
            {
              "expr": "flagger_canary_weight{workload=\"mesh-test-app-primary\", exported_namespace=\"mesh-test\"}",
              "legendFormat": "Primary Weight %",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6}
        },
        {
          "id": 6,
          "title": "Success Rate Over Time",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\",classification!=\"failure\"}[1m]))/sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m]))*100",
              "legendFormat": "Success Rate %",
              "refId": "A"
            },
            {
              "expr": "95",
              "legendFormat": "Threshold (95%)",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "percent",
              "min": 90,
              "max": 100
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6}
        },
        {
          "id": 7,
          "title": "Request Rate by Service",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14}
        },
        {
          "id": 8,
          "title": "Response Latency P99",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(response_latency_ms_bucket{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m])) by (le, pod))",
              "legendFormat": "{{pod}} P99",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ms"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14}
        },
        {
          "id": 9,
          "title": "HTTP Status Codes",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\"}[1m])) by (status_code)",
              "legendFormat": "{{status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 22}
        },
        {
          "id": 10,
          "title": "Primary vs Canary Traffic Distribution",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\",pod=~\".*primary.*\"}[1m]))",
              "legendFormat": "Primary Requests/sec",
              "refId": "A"
            },
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",target_port=\"3000\",pod!~\".*primary.*\"}[1m]))",
              "legendFormat": "Canary Requests/sec",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 22}
        },
        {
          "id": 11,
          "title": "mTLS Security Status",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\",tls=\"true\"}[1m])) / sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\"}[1m])) * 100",
              "legendFormat": "mTLS %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {"color": "red", "value": 0},
                  {"color": "yellow", "value": 50},
                  {"color": "green", "value": 90}
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 30}
        },
        {
          "id": 12,
          "title": "TLS Connection Breakdown",
          "type": "piechart",
          "targets": [
            {
              "expr": "sum(rate(response_total{namespace=\"mesh-test\",direction=\"inbound\"}[1m])) by (tls)",
              "legendFormat": "{{tls}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"options": {"true": {"text": "mTLS Secured"}}, "type": "value"},
                {"options": {"no_identity": {"text": "No Identity"}}, "type": "value"},
                {"options": {"false": {"text": "Plain HTTP"}}, "type": "value"}
              ]
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 30}
        },
        {
          "id": 13,
          "title": "Identity Certificate Status",
          "type": "timeseries",
          "targets": [
            {
              "expr": "control_identity_cert_expiration_timestamp_seconds - time()",
              "legendFormat": "Cert TTL (seconds)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s"
            }
          },
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 30}
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "5s",
      "schemaVersion": 27,
      "version": 1
    }