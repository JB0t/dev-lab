---
# Simplified PodMonitor for Linkerd Proxy metrics with cleaner selector
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy-simple
  namespace: monitoring
  labels:
    app.kubernetes.io/name: linkerd-proxy-simple
    app.kubernetes.io/part-of: linkerd
    release: kube-prometheus-stack
spec:
  namespaceSelector: {}  # All namespaces
  selector:
    matchExpressions:
    - key: linkerd.io/control-plane-ns
      operator: In
      values: ["linkerd"]
  podMetricsEndpoints:
  - port: linkerd-admin
    interval: 30s
    path: /stats/prometheus
---
# Also create a basic test ServiceMonitor for mesh-test-app service metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mesh-test-service
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mesh-test-service
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - mesh-test
  selector:
    matchLabels:
      app: mesh-test-app
  endpoints:
  - port: http
    interval: 30s
    path: /metrics