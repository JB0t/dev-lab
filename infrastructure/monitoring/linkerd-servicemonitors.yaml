---
# ServiceMonitor for Linkerd Controller metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: linkerd-controller
  namespace: monitoring
  labels:
    app.kubernetes.io/name: linkerd-controller
    app.kubernetes.io/part-of: linkerd
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - linkerd
    - linkerd-viz
  selector:
    matchLabels:
      linkerd.io/control-plane-component: controller
  endpoints:
  - port: admin
    interval: 30s
    path: /metrics
---
# ServiceMonitor for Linkerd Control Plane Services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: linkerd-control-plane
  namespace: monitoring
  labels:
    app.kubernetes.io/name: linkerd-control-plane
    app.kubernetes.io/part-of: linkerd
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - linkerd
  selector:
    matchLabels:
      linkerd.io/control-plane-component: destination
  endpoints:
  - port: dest-admin
    interval: 30s
    path: /metrics

---
# PodMonitor for Linkerd Proxy metrics - the primary source of proxy metrics
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: linkerd-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: linkerd-proxy
    app.kubernetes.io/part-of: linkerd
    release: kube-prometheus-stack
spec:
  namespaceSelector: {}  # Monitor all namespaces
  selector:
    matchLabels:
      linkerd.io/control-plane-ns: linkerd
  podMetricsEndpoints:
  - port: linkerd-admin
    interval: 30s
    path: /stats/prometheus
    relabelings:
    # Only scrape linkerd-proxy containers
    - sourceLabels: [__meta_kubernetes_pod_container_name]
      action: keep
      regex: linkerd-proxy
    # Add useful labels
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_label_app]
      targetLabel: app
