---
# GitHub SecretStore for dev-lab
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: github-secret-store
  namespace: external-secrets
spec:
  provider:
    github:
      # Repository configuration
      owner: jbotstevens
      repo: dev-lab
      # Authentication using GitHub App or Personal Access Token
      auth:
        secretRef:
          # Secret containing GitHub authentication token
          token:
            name: github-auth-secret
            key: token
