---
# GitHub SecretStore for dev-lab
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: github-secret-store
  namespace: external-secrets
spec:
  provider:
    github:
      # GitHub App configuration
      appID: 2046683  # Replace with your GitHub App ID
      installationID: 88303706  # Replace with your GitHub App Installation ID
      organization: jbotstevens
      repository: dev-lab
      # Authentication using GitHub App private key
      auth:
        privateKey:
          name: github-app-secret
          key: private-key
