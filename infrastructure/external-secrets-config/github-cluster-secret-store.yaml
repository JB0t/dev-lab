---
# ClusterSecretStore for cross-namespace access
# This is dev-lab specific configuration for GitHub Secrets integration
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: github-cluster-secret-store
spec:
  provider:
    github:
      appID: 2046683  # Replace with your GitHub App ID
      installationID: 88303706  # Replace with your GitHub App Installation ID
      organization: jbotstevens
      repository: dev-lab
      auth:
        privateKey:
          name: github-app-secret
          key: private-key
          namespace: external-secrets