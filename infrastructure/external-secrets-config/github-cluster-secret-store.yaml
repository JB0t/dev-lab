---
# ClusterSecretStore for cross-namespace access
# This is dev-lab specific configuration for GitHub Secrets integration
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: github-cluster-secret-store
spec:
  provider:
    github:
      owner: jbotstevens
      repo: dev-lab
      auth:
        secretRef:
          token:
            name: github-auth-secret
            key: token
            namespace: external-secrets