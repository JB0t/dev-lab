name: Auth Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-auth:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test GitHub API access
        run: |
          echo "Testing GitHub API authentication..."
          
          # Test API access with the provided token
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${{ github.repository }}" \
               --silent --show-error --fail
          
          echo "✅ GitHub API access successful"

      - name: Test comment creation (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const comment = await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🧪 **Auth Test Successful!**\n\nThis comment was created by the auth test workflow to verify GitHub token permissions are working correctly.\n\n*This comment will be automatically deleted.*'
              });
              
              console.log('✅ Comment created successfully:', comment.data.html_url);
              
              // Delete the test comment after a short delay
              setTimeout(async () => {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.data.id
                });
                console.log('🗑️ Test comment deleted');
              }, 5000);
              
            } catch (error) {
              console.error('❌ Comment creation failed:', error.message);
              core.setFailed(`Failed to create comment: ${error.message}`);
            }

      - name: Show token info (debug)
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Token length: ${#GITHUB_TOKEN}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}