---
# Application-specific PodMonitor for Enhanced Canary Metrics
# Enables precise per-deployment metrics collection for accurate canary analysis
# OPTIONAL: Use for production/critical services requiring enhanced monitoring
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: SERVICE_NAME_PLACEHOLDER-linkerd-proxy
  namespace: SERVICE_NAME_PLACEHOLDER
  labels:
    app: SERVICE_NAME_PLACEHOLDER
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: SERVICE_NAME_PLACEHOLDER
  podMetricsEndpoints:
  - port: linkerd-admin
    interval: 30s
    path: /metrics
    relabelings:
    # Only scrape linkerd-proxy containers
    - sourceLabels: [__meta_kubernetes_pod_container_name]
      action: keep
      regex: linkerd-proxy
    # Add useful labels for querying
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_label_app]
      targetLabel: app
    - sourceLabels: [__meta_kubernetes_pod_label_version]
      targetLabel: version