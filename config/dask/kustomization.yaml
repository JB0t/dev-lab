# Namespace, client RBAC and the devlab_dask helper for Dask GPU clusters.
# Apply: ./devlab kubectl -- apply -k config/dask
# The clusters themselves are created by clients (devlab_dask.gpu_cluster) through
# the Dask Kubernetes Operator: ./devlab addon enable dask-operator
# Runbook: DASK-GPU-RUNBOOK.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dask
resources:
  - namespace.yaml
  - rbac.yaml
configMapGenerator:
  # Mounted by in-cluster clients (see sample/job.yaml); PYTHONPATH=/devlab
  - name: devlab-dask
    files:
      - devlab_dask.py
  # The Dagster code location (devlab addon enable dagster), mounted at /dagster
  - name: devlab-dagster
    files:
      - dagster/definitions.py
      - dagster/postgres_io_manager.py
      - sample/gpu_concurrency.py
generatorOptions:
  disableNameSuffixHash: true
