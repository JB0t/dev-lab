# Dask client that runs gpu_concurrency.py: creates a GPU Dask cluster with
# 0 workers, submits one GPU task per worker, and checks the autoscaler started
# the workers and they all ran at the same time. The cluster is deleted at the end.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-concurrency
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: dask-client
      restartPolicy: Never
      # CPU node, like the scheduler; only the workers use GPU nodes
      nodeSelector:
        devlab.io/gpu: "false"
      containers:
        - name: client
          image: localhost:5000/devlab-dask-gpu:2026.1.1
          command: ["python", "/scripts/gpu_concurrency.py"]
          env:
            - name: PYTHONPATH
              value: /devlab
            - name: N_WORKERS
              value: "4"
            # GPU memory per worker (= nvidia.com/gpu shares). 4 x 5 GiB fits
            # an A10-24Q (22 shares); use 2 on an 11 GB card
            - name: GPU_MEMORY_GIB
              value: "5"
            # With MPS (GPU.md) a worker takes 1 share, a fixed slice of the GPU
            # - name: GPU_SHARES
            #   value: "1"
            - name: TASK_SECONDS
              value: "30"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: devlab-dask
              mountPath: /devlab
      volumes:
        - name: script
          configMap:
            name: gpu-concurrency-script
        - name: devlab-dask
          configMap:
            name: devlab-dask
