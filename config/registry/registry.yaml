---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: dev-lab-registry
data:
  config.yml: |
    version: 0.1
    log:
      fields:
        service: registry
    storage:
      cache:
        blobdescriptor: inmemory
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
# A single registry on the control-plane node. The host reaches it through the
# node's port 5000 mapping, and containerd on every node reaches it at
# dev-lab-control-plane:5000 (cluster/kind-config.yaml). Storage is the node's
# /var/lib/registry, which KinD mounts from /tmp/dev-lab-registry on the host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: dev-lab-registry
  labels:
    app: docker-registry
spec:
  replicas: 1
  # hostPort and a single hostPath volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: registry
        image: registry:2.8
        ports:
        - containerPort: 5000
          hostPort: 5000
          name: registry
          protocol: TCP
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
        - name: registry-config
          mountPath: /etc/docker/registry
        readinessProbe:
          httpGet:
            path: /v2/
            port: registry
        resources:
          limits:
            memory: "1Gi"
            cpu: "300m"
          requests:
            memory: "128Mi"
            cpu: "50m"
      volumes:
      - name: registry-data
        hostPath:
          path: /var/lib/registry
          type: DirectoryOrCreate
      - name: registry-config
        configMap:
          name: registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: docker-registry
  namespace: dev-lab-registry
spec:
  selector:
    app: docker-registry
  ports:
  - port: 5000
    targetPort: 5000
    name: registry
