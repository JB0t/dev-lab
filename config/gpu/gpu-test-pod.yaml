# Smoke test: runs a CUDA vector addition on one GPU share, then exits
# devlab kubectl apply -f config/gpu/gpu-test-pod.yaml && devlab kubectl logs gpu-test
# Expected log: "[Vector addition of 50000 elements] ... Test PASSED"
# CUDA 12.5 build: runs on any CUDA 12.x driver (R525 or newer)
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  # GPU pods need the nvidia runtime; it is not the default on dev-lab nodes
  runtimeClassName: nvidia
  restartPolicy: OnFailure
  containers:
    - name: vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/gpu: 1
