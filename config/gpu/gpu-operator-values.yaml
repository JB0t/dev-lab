# NVIDIA GPU Operator on the GPU-enabled dev-lab cluster (bootstrap --gpu)
# Chart: nvidia/gpu-operator (version pinned in python/devlab.py)
#
# The kind nodes already have what the operator would normally install: the
# host driver is injected into each GPU node by the host
# nvidia-container-runtime, and bootstrap --gpu installs the NVIDIA Container
# Toolkit and the `nvidia` containerd runtime in each GPU node. The operator
# runs the rest: device plugin, GPU feature discovery, node feature discovery,
# DCGM exporter and its validator. This is the setup nvkind documents.
driver:
  enabled: false
toolkit:
  enabled: false

operator:
  # Operand pods need the nvidia runtime; it is not the containerd default
  runtimeClass: nvidia

# GPUs reach containers through the nvidia runtime's legacy mode, where
# bootstrap --gpu turns off CUDA forward compatibility (see python/devlab.py,
# CONFIGURE_RUNTIME_SCRIPT). With CDI, the device plugin's CDI spec would load
# forward-compat libraries from images, which fail on GPUs without forward
# compatibility support.
cdi:
  enabled: false

# Nodes labelled nvidia.com/gpu.deploy.operands=false (the control plane and
# CPU-only workers, see cluster/gpu-workers.yaml) get no operands, although
# NFD sees the host's GPUs from every kind node.

devicePlugin:
  # GPU time slicing in GiB: each physical GPU is advertised as one
  # nvidia.com/gpu share per GiB of its memory (devlab replaces
  # ${GPU_MEMORY_GIB} with the GPU's memory, e.g. 22 on an A10-24Q). A pod
  # requests as many shares as the GiB of GPU memory it may use, so
  # Kubernetes only places it where that much is free, on any GPU node.
  # Time slicing shares compute only: there is no memory or fault isolation,
  # so every pod must limit its own GPU memory to its shares (the Dask
  # helper in config/dask does this).
  #
  # - Fixed share count instead: replace ${GPU_MEMORY_GIB} with a number
  #   (>= 2), then run ./devlab gpu-operator
  # - Turn off for the whole cluster: set `default: exclusive`, then run
  #   ./devlab gpu-operator
  # - Turn off for one node (no reinstall):
  #   ./devlab kubectl label node <node> nvidia.com/device-plugin.config=exclusive --overwrite
  # - MPS instead of time slicing on one node (experimental, see GPU.md):
  #   ./devlab kubectl label node <node> nvidia.com/device-plugin.config=mps --overwrite
  config:
    create: true
    name: time-slicing-config
    default: time-sliced
    data:
      time-sliced: |-
        version: v1
        sharing:
          timeSlicing:
            # Keep the resource name nvidia.com/gpu (not nvidia.com/gpu.shared)
            renameByDefault: false
            # Pods request several shares (GiB) of one GPU
            failRequestsGreaterThanOne: false
            resources:
              - name: nvidia.com/gpu
                replicas: ${GPU_MEMORY_GIB}
      # One pod per physical GPU (no sharing)
      exclusive: |-
        version: v1
      # CUDA MPS: kernels of several pods run on the GPU at the same time
      # instead of taking turns. The plugin runs an MPS control daemon on the
      # node, which limits every client to an equal slice: 1/replicas of the
      # GPU memory and of its SMs. A share is one slice, so a pod requests 1
      # (more is refused) and keeps its GPU memory under memory/replicas.
      # Experimental: less isolation than time slicing (one pod's GPU fault
      # can stop the others), and the daemon puts the GPU in the
      # Exclusive_Process compute mode while it runs.
      mps: |-
        version: v1
        sharing:
          mps:
            renameByDefault: false
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                replicas: 4

validator:
  # The validator's CUDA sample loads CUDA forward-compatibility libraries
  # from its own image when the driver is older than CUDA 12.9 (e.g. a 12.8
  # vGPU guest driver), which fails on GPUs without forward compatibility
  # support. Skip the sample workloads; the driver, toolkit and device plugin
  # checks still run, and config/gpu/gpu-test-pod.yaml runs a real CUDA test.
  cuda:
    env:
      - name: WITH_WORKLOAD
        value: "false"
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"

dcgmExporter:
  # GPU metrics for the monitoring stack. kube-prometheus-stack only selects
  # ServiceMonitors labelled release=kube-prometheus-stack; devlab turns the
  # ServiceMonitor off when the monitoring stack is not installed.
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
