---
# GitRepository for Service Mesh Layer
# This resource should be deployed in the main orchestrating repository
# to reference this service mesh layer repository
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-service-mesh-layer
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 5m
  url: ssh://git@github.com/example-org/flux-service-mesh-layer.git
  ref:
    branch: main
  secretRef:
    name: flux-service-mesh-layer-auth