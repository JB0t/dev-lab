---
# Base infrastructure - core services, namespaces, metrics-server
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-base
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/base"
  prune: true
  wait: true
  timeout: 5m0s

---
# Prometheus monitoring stack with CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-prometheus
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/prometheus-stack"
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: dev-lab-base
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kube-prometheus-stack-operator
      namespace: monitoring

---
# Container registry (independent)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-registry
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/container-registry"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-base

---
# External Secrets Operator - installs the operator and CRDs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-external-secrets
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/external-secrets"
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: dev-lab-base
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: external-secrets
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets-webhook
      namespace: external-secrets
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets-cert-controller
      namespace: external-secrets

---
# External Secrets Configuration - ClusterSecretStore and other configs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-external-secrets-config
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/external-secrets-config"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      name: github-cluster-secret-store
      namespace: external-secrets

---
# Certificate management - cert-manager installation only
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-cert-manager
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/linkerd-cert-manager"
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: dev-lab-external-secrets-config
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-cert-manager
      namespace: linkerd
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-cert-manager-webhook
      namespace: linkerd
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-cert-manager-cainjector
      namespace: linkerd

---
# Linkerd certificates (depends on cert-manager being ready)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-linkerd-certs
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/linkerd-certificates"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-external-secrets-config
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: linkerd-identity-issuer
      namespace: linkerd

---
# Service mesh - Linkerd only (depends on cert-manager)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-service-mesh
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/service-mesh"
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: dev-lab-linkerd-certs
    - name: dev-lab-external-secrets-config
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-destination
      namespace: linkerd
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-proxy-injector
      namespace: linkerd
    - apiVersion: apps/v1
      kind: Deployment
      name: linkerd-identity
      namespace: linkerd

---
# Networking - ingress controller (gets injected with Linkerd proxy)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-networking
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/networking"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-service-mesh
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx

---
# Flagger - progressive delivery (needs Linkerd + Prometheus)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-flagger
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/flagger"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-service-mesh
    - name: dev-lab-prometheus

---
# Monitoring extras - ServiceMonitors, PodMonitors (needs Prometheus CRDs + Linkerd)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-monitoring
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./infrastructure/monitoring"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-prometheus
    - name: dev-lab-service-mesh

---
# Applications (depends on everything being ready)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-lab-apps
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  interval: 30s
  sourceRef:
    kind: GitRepository
    name: dev-lab-repo
  path: "./apps"
  prune: true
  wait: true
  timeout: 5m0s
  dependsOn:
    - name: dev-lab-service-mesh
    - name: dev-lab-networking
    - name: dev-lab-prometheus
    - name: dev-lab-monitoring
    - name: dev-lab-registry
    - name: dev-lab-flagger
