---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: mesh-test
data:
  redis.conf: |
    # Redis configuration for service mesh testing
    bind 0.0.0.0
    port 6379
    protected-mode no
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    
    # Memory and performance
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    
    # Logging
    loglevel notice
    
    # Persistence (disabled for testing)
    save ""
    
    # Security (basic - in production use proper auth)
    # requirepass changeme

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mesh-test
  labels:
    app: redis
    version: "7.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        version: "7.0"
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
          - /etc/redis/redis.conf
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-config

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: mesh-test
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP