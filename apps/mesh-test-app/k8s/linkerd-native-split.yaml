# Linkerd native traffic splitting using Service Profiles
# This is more reliable than SMI TrafficSplit

---
# Service Profile for the main service
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: mesh-test-app-service.mesh-test.svc.cluster.local
  namespace: mesh-test
spec:
  routes:
  - name: root
    condition:
      method: GET
      pathRegex: /
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true

---
# TrafficSplit using Linkerd's native implementation
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: mesh-test-app-linkerd-split
  namespace: mesh-test
  annotations:
    linkerd.io/created-by: linkerd/stable-2.14.1
spec:
  service: mesh-test-app-service
  backends:
  - service: mesh-test-app-service-v1
    weight: 90
  - service: mesh-test-app-service-v2
    weight: 10