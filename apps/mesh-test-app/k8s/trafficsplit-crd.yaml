# TrafficSplit CRD for SMI compatibility
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trafficsplits.split.smi-spec.io
spec:
  group: split.smi-spec.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              service:
                type: string
              backends:
                type: array
                items:
                  type: object
                  properties:
                    service:
                      type: string
                    weight:
                      type: integer
          status:
            type: object
  scope: Namespaced
  names:
    plural: trafficsplits
    singular: trafficsplit
    kind: TrafficSplit