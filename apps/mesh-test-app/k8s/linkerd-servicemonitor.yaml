---
# ServiceMonitor for Flagger load tester (for canary metrics)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flagger-loadtester
  namespace: monitoring
  labels:
    app.kubernetes.io/name: flagger-loadtester
    app.kubernetes.io/part-of: flagger
    release: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
    - mesh-test
  selector:
    matchLabels:
      app: flagger-loadtester
  endpoints:
  - port: http
    interval: 15s
    path: /metrics