apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mesh-test-app
  namespace: mesh-test

resources:
  - base.yaml
  - redis.yaml
  - monitoring.yaml
  # Linkerd configuration
  - linkerd-httproute.yaml
  - linkerd-metric-templates.yaml  # Contains all metric templates
  - linkerd-podmonitor.yaml
  - linkerd-servicemonitor.yaml
  - loadtester.yaml
  # Flagger canary deployment (uncomment to enable progressive delivery)
  # IMPORTANT: Only enable this AFTER Flagger is installed and mesh-test-app is running
  - canary.yaml