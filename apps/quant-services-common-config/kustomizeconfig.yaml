---
# Kustomize config for enabling HelmRelease values from
# ConfigMaps and Secrets generated by Kustomize
# This ensures that each config map gets a unique name when updated and this is then passed into each HelmRelease
# https://fluxcd.io/docs/guides/helmreleases/#refer-to-values-in-configmaps-generated-with-kustomize
# https://github.com/kubernetes-sigs/kustomize/blob/master/examples/transformerconfigs/README.md
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/valuesFrom/name
        kind: HelmRelease
        version: v2
        group: helm.toolkit.fluxcd.io
      - path: spec/valuesFrom/name
        kind: HelmRelease
        version: v2beta1
        group: helm.toolkit.fluxcd.io
      - path: spec/valuesFrom/name
        kind: HelmRelease
        version: v2beta2
        group: helm.toolkit.fluxcd.io
