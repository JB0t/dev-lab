---
# Common configuration for all quant-services charts
image:
  registry: "docker-registry.dev-lab-registry:5000"
  repository: ""
  pullPolicy: "IfNotPresent"

# Common environment variables
env:
  # Google OAuth Configuration
  GOOGLE_CLIENT_ID: "GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "GOOGLE_CLIENT_SECRET"
  
  # Kafka Configuration
  ADH_KAFKA_BOOTSTRAP_SERVERS: "ADH_KAFKA_BOOTSTRAP_SERVERS"
  ADH_KAFKA_TOPIC: "ADH_KAFKA_TOPIC"
  KAFKA_BOOTSTRAP_SERVERS: "quant-cluster-kafka-bootstrap.quant-services.svc.cluster.local:9192"
  
  # ClickHouse Configuration
  CLICKHOUSE_HOST: "clickhouse-clickhouse.clickhouse.svc.cluster.local"
  CLICKHOUSE_PORT: "8123"
  
  # Redis Configuration
  REDIS_HOST: "redis-master.quant-services.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Dashboard Redis Configuration
  DASH_REDIS_HOST: "redis-master.quant-services.svc.cluster.local"
  DASH_REDIS_PORT: "6379"

# Common resource limits
resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Common service account settings
serviceAccount:
  create: true
  annotations: {}

# Common pod annotations for Linkerd injection
podAnnotations:
  linkerd.io/inject: "enabled"
  config.linkerd.io/skip-outbound-ports: "5000"
