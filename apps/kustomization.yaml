apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Central Application Control Panel
# Enable/disable applications by commenting/uncommenting resources below

resources:
  # ============================================================================
  # GITREPOSITORY SOURCES (Always deploy these to make repos available)
  # ============================================================================
  - quant-services/gitrepository.yaml
  
  # ============================================================================
  # CONFIGURATION (Deploy ConfigMaps before applications)
  # ============================================================================
  - quant-services/qs-namespace.yaml
  
  # ============================================================================
  # ACTIVE APPLICATIONS (Comment out to disable)
  # ============================================================================
  
  # Canary Demo Applications
  # - mesh-test-app/k8s
  # - order-service/k8s
  
  # Quant Services HelmReleases (managed locally for ConfigMap name references)
  - quant-services/adh-consumer.yaml
  - quant-services/betticker-ws.yaml
  - quant-services/dash-auth.yaml
  - quant-services/dash-ws.yaml
  - quant-services/external-prices-gather.yaml
  - quant-services/nba-livescores.yaml
  - quant-services/news-gather.yaml
  - quant-services/rapid-pini-feeder.yaml
  - quant-services/rw-proj-min-store.yaml
  - quant-services/rw-proj-min.yaml
  - quant-services/unabated-news-feeder.yaml
  - quant-services/wnba-reports.yaml

# ============================================================================
# CONFIGMAP GENERATION (Quant Services common configuration)
# ============================================================================
configMapGenerator:
  - name: qs-common-config
    namespace: quant-services
    files:
      - values.yaml=quant-services/qs-common-values.yaml

# Disable hashing for predictable names (we'll use other methods for change detection)
generatorOptions:
  disableNameSuffixHash: true

# Enable name reference updates and hashing
configurations:
  - quant-services/kustomizeconfig.yaml
  
# ============================================================================
# TESTING/DEVELOPMENT APPLICATIONS (Usually disabled in production)
# ============================================================================
# - mtls-test-app/k8s
