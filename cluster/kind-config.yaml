# KinD cluster configuration for local development lab
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-lab

# Note: All nodes are labeled with ingress-ready=true to support NGINX ingress controller

# Networking configuration
networking:
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet  
  serviceSubnet: "10.96.0.0/16"
  # API server port
  apiServerPort: 6443

# Node configuration for HA setup
nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose registry port
      - containerPort: 5000
        hostPort: 5000
        protocol: TCP
      # Expose ingress controller ports (using high ports to avoid conflicts)
      - containerPort: 80
        hostPort: 30080
        protocol: TCP
      - containerPort: 443
        hostPort: 30443
        protocol: TCP
      # Expose Prometheus
      - containerPort: 9090
        hostPort: 30090
        protocol: TCP
      # Expose Grafana
      - containerPort: 3000
        hostPort: 30030
        protocol: TCP
    extraMounts:
      # Mount local registry data (ensure directory exists)
      - hostPath: /tmp/dev-lab-registry
        containerPath: /var/lib/registry

  # Worker node 1
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  # Worker node 2  
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
