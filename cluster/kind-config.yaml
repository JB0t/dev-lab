# KinD cluster configuration for local development lab
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-lab

# Networking configuration
networking:
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"
  # API server port
  apiServerPort: 6443

# Only the control-plane node receives traffic from the host. Services are
# exposed through the Traefik ingress (ports 80/443) by hostname, or ad hoc with
# `devlab kubectl port-forward`, so no per-service ports are mapped here.
# See NETWORKING.md.
nodes:
  - role: control-plane
    extraPortMappings:
      # Local registry (Deployment pinned to this node with hostPort 5000)
      - containerPort: 5000
        hostPort: 5000
        protocol: TCP
      # Traefik ingress controller (pinned to this node with hostPort 80/443)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      # Registry storage on the Docker host, so pushed images survive a
      # cluster recreate
      - hostPath: /tmp/dev-lab-registry
        containerPath: /var/lib/registry

  - role: worker
  - role: worker

# Container runtime configuration for local registry
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://dev-lab-control-plane:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."dev-lab-control-plane:5000".tls]
      insecure_skip_verify = true
    [plugins."io.containerd.grpc.v1.cri".registry.configs."localhost:5000".tls]
      insecure_skip_verify = true
