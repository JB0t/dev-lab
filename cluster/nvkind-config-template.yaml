# nvkind config template for the GPU-enabled dev-lab cluster
# Rendered by `nvkind cluster create --config-template` with values from
# nvkind-values.yaml. Mirrors kind-config.yaml; only the worker nodes differ.
# See https://github.com/NVIDIA/nvkind for template functions (sprig + numGPUs).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev-lab

# Note: All nodes are labeled with ingress-ready=true to support NGINX ingress controller

# Networking configuration
networking:
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"
  # API server port
  apiServerPort: 6443

nodes:
  # Control plane node (no GPUs)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose registry port
      - containerPort: 5000
        hostPort: 5000
        protocol: TCP
      # Expose ingress controller ports (using high ports to avoid conflicts)
      - containerPort: 80
        hostPort: 30080
        protocol: TCP
      - containerPort: 443
        hostPort: 30443
        protocol: TCP
      # Expose Prometheus
      - containerPort: 9090
        hostPort: 30090
        protocol: TCP
      # Expose Grafana
      - containerPort: 3000
        hostPort: 30030
        protocol: TCP
    extraMounts:
      # Mount local registry data (ensure directory exists)
      - hostPath: /tmp/dev-lab-registry
        containerPath: /var/lib/registry

  # One worker per entry in .workers; entries with `devices` get those GPUs
{{- range $.workers }}
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  {{- if hasKey . "devices" }}
  {{- $devices := .devices }}
  {{- if not (kindIs "slice" $devices) }}
    {{- $devices = list .devices }}
  {{- end }}
    # Lets the nvidia-device-plugin DaemonSet schedule here without NFD
    labels:
      nvidia.com/gpu.present: "true"
    extraMounts:
      # GPUs are injected by the host nvidia-container-runtime. This requires
      # `accept-nvidia-visible-devices-as-volume-mounts = true` in
      # /etc/nvidia-container-runtime/config.toml
      {{- range $d := $devices }}
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/{{ $d }}
      {{- end }}
  {{- end }}
{{- end }}

# Container runtime configuration for local registry
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5000"]
      endpoint = ["http://dev-lab-control-plane:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."dev-lab-control-plane:5000".tls]
      insecure_skip_verify = true
    [plugins."io.containerd.grpc.v1.cri".registry.configs."localhost:5000".tls]
      insecure_skip_verify = true
