apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster-runner-sa
  namespace: dagster-dask
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dagster-runner-admin
subjects:
  - kind: ServiceAccount
    name: dagster-runner-sa
    namespace: dagster-dask
roleRef:
  kind: ClusterRole
  name: cluster-admin # Given admin rights for testing purposes locally
  apiGroup: rbac.authorization.k8s.io

